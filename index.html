<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pumpkin Carver</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <canvas id="inside"  width="500" height="250"></canvas>
        <canvas id="outside" width="500" height="250"></canvas>
        <div class="btns">
            <button onclick="window.fireColor = 'red'">red</button>
            <button onclick="window.fireColor = 'blue'">blue</button>
            <button onclick="window.fireColor = 'green'">green</button>
            <button onclick="window.fireColor = 'purple'">purple</button>
            <button onclick="window.fireColor = 'white'">white</button>
            <button onclick="window.fireColor = 'rainbow'">rainbow</button>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
